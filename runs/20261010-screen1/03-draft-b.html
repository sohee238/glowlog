<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 시안 b: 날짜를 맨 위에 먼저 세우고 사진 카드(88px 큰 타일)를 주인공으로 올린 뒤, 카테고리·세부 항목·메모를 구분선으로 나눈 한 장의 통합 카드에 담는 '사진 먼저' 구성 -->
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Glowlog 오늘 한 관리 시안 B</title>
<style>
  * { box-sizing: border-box; }
  body { width: 390px; height: 844px; margin: 0; padding: 0; }

  .app {
    display: flex;
    flex-direction: column;
    padding: 0 20px 24px;
    background: linear-gradient(160deg, #EEEAF5 0%, #E8E7ED 50%, #E5EEF0 100%);
    color: #2E2B3F;
    font-family: "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0;
  }

  /* Text Styles */
  .t-h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.4; letter-spacing: -0.3px; }
  .t-h2 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.5; letter-spacing: 0; }
  .t-body { margin: 0; font-size: 14px; font-weight: 400; line-height: 1.6; letter-spacing: 0; }
  .t-strong { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.6; letter-spacing: 0; }
  .t-caption { margin: 0; font-size: 12px; font-weight: 400; line-height: 1.5; letter-spacing: 0; }
  .t-label { margin: 0; font-size: 11px; font-weight: 600; line-height: 1.4; letter-spacing: 0.8px; }

  /* Colors */
  .c-primary { color: #2E2B3F; }
  .c-secondary { color: #5C5872; }
  .c-muted { color: #9491A7; }
  .c-accent { color: #8B7ED8; }
  .c-white { color: #FFFFFF; }

  .one-line { white-space: nowrap; }
  .link { text-decoration: none; white-space: nowrap; }

  /* Top bar */
  .top {
    height: 48px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }
  .top-side { display: flex; }

  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Headline: 날짜 먼저 */
  .headline { display: flex; flex-direction: column; gap: 4px; }
  .date-group { display: flex; align-items: center; gap: 8px; padding: 0 0 4px; }
  .cal {
    width: 16px;
    height: 16px;
    display: flex;
    flex-direction: column;
    border: 2px solid #8B7ED8;
    border-radius: 6px;
  }
  .cal-bar { height: 4px; background: #8B7ED8; }

  /* Card */
  .card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.70);
    border-radius: 20px;
    padding: 16px 20px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }
  .card-sheet { gap: 12px; }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .label-row { display: flex; align-items: center; gap: 4px; }
  .divider { height: 1px; background: #C9C7D4; }

  /* Badge (category chip) — 2×2 그리드 */
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }
  .badge-off { background: rgba(255, 255, 255, 0.45); color: #5C5872; border: 1px solid #C9C7D4; }
  .badge-on { background: linear-gradient(135deg, #F2C4CE, #E8D5F5, #C5D8F7, #C5EDE0); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, 0.70); }
  .ic { width: 10px; height: 10px; }
  .ic-round { border-radius: 50%; }
  .ic-on { background: rgba(255, 255, 255, 0.8); }
  .ic-iris { background: #C9BFF0; }
  .ic-rose { background: #F2B8CC; }
  .ic-mist { background: #A3D9D1; }

  /* Input */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .input {
    width: 100%;
    min-width: 0;
    margin: 0;
    padding: 8px 12px;
    background: #F5F4F7;
    border: 1px solid #C9C7D4;
    border-radius: 12px;
    color: #2E2B3F;
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0;
  }
  .input:focus { border-color: #8B7ED8; outline: none; }
  .input::placeholder { color: #9491A7; }
  .input-date { width: 140px; }
  .memo { height: 64px; resize: none; }

  /* Photo tiles (big) */
  .tiles { display: flex; gap: 8px; }
  .tile { width: 88px; height: 88px; border-radius: 12px; }
  .tile-add {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.45);
    border: 1px dashed #C9C7D4;
  }
  .thumb {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4px;
  }
  .thumb-top { display: flex; justify-content: flex-end; }
  .thumb-rose { background: #FCE8EF; }
  .thumb-mist { background: #E2F3F0; }
  .del {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #5C5872;
  }
  .thumb-tag { padding: 0 4px; }

  /* Footer */
  .foot { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 0 0; }
  .cta {
    width: 100%;
    margin: 0;
    border: 0;
    padding: 16px 24px;
    border-radius: 20px;
    background: linear-gradient(135deg, #F2C4CE, #E8D5F5, #C5D8F7, #C5EDE0);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.6;
    letter-spacing: 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }
</style>
</head>
<body class="app">

  <header class="top">
    <div class="top-side">
      <a class="link t-h2 c-primary" aria-label="뒤로가기">←</a>
    </div>
    <h1 class="t-h2 c-primary">오늘 한 관리</h1>
    <div class="top-side"></div>
  </header>

  <main class="main">

    <!-- 날짜 → 질문형 헤드라인 -->
    <section class="headline">
      <div class="date-group">
        <input class="input input-date" type="text" value="2026.10.10 (토)" aria-label="관리 날짜" data-token="component/input">
        <span class="cal" aria-hidden="true"><span class="cal-bar"></span></span>
      </div>
      <h2 class="t-h1 c-primary one-line">오늘 어떤 관리를 했나요?</h2>
      <p class="t-caption c-secondary one-line">사진부터 남기고, 아래에서 내용을 채워주세요</p>
    </section>

    <!-- 사진 (주인공) -->
    <section class="card" data-token="component/card">
      <div class="sec-head">
        <h3 class="t-label c-secondary">사진</h3>
        <span class="t-caption c-muted">여러 장 첨부할 수 있어요</span>
      </div>
      <div class="tiles">
        <div class="tile tile-add" role="group" aria-label="사진 추가">
          <span class="t-h1 c-accent">+</span>
          <span class="t-caption c-secondary one-line">촬영·앨범</span>
          <span class="t-caption c-muted">2/10</span>
        </div>
        <div class="tile thumb thumb-rose" aria-label="첨부 사진 1">
          <span class="thumb-top"><span class="del t-label c-white" aria-label="사진 삭제">×</span></span>
          <span class="thumb-tag t-label c-secondary">아침</span>
        </div>
        <div class="tile thumb thumb-mist" aria-label="첨부 사진 2">
          <span class="thumb-top"><span class="del t-label c-white" aria-label="사진 삭제">×</span></span>
          <span class="thumb-tag t-label c-secondary">저녁</span>
        </div>
      </div>
    </section>

    <!-- 통합 카드: 카테고리 / 세부 항목 / 메모 -->
    <section class="card card-sheet" data-token="component/card">

      <div class="sec">
        <h3 class="t-label c-secondary">카테고리</h3>
        <div class="chips" role="radiogroup" aria-label="관리 카테고리">
          <span class="badge badge-on" role="radio" aria-checked="true" data-token="component/badge"><span class="ic ic-round ic-on"></span>화장품</span>
          <span class="badge badge-off" role="radio" aria-checked="false" data-token="component/badge"><span class="ic ic-iris"></span>뷰티 디바이스</span>
          <span class="badge badge-off" role="radio" aria-checked="false" data-token="component/badge"><span class="ic ic-round ic-rose"></span>피부과 시술</span>
          <span class="badge badge-off" role="radio" aria-checked="false" data-token="component/badge"><span class="ic ic-mist"></span>마사지·기타</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="sec">
        <div class="grid2">
          <label class="field">
            <span class="t-label c-secondary">브랜드명</span>
            <input class="input" type="text" value="닥터지" data-token="component/input">
          </label>
          <label class="field">
            <span class="t-label c-secondary">제품·시술명</span>
            <input class="input" type="text" value="비타민C 세럼" data-token="component/input">
          </label>
        </div>
        <label class="field">
          <span class="label-row">
            <span class="t-label c-secondary">사용 부위</span>
            <span class="t-caption c-muted">선택</span>
          </span>
          <input class="input" type="text" placeholder="예: 양 볼, 광대 색소 부위" data-token="component/input">
        </label>
      </div>

      <div class="divider"></div>

      <label class="field">
        <span class="label-row">
          <span class="t-label c-secondary">메모</span>
          <span class="t-caption c-muted">선택</span>
        </span>
        <textarea class="input memo" placeholder="피부 반응, 느낌, 주의사항을 적어두세요" data-token="component/input"></textarea>
      </label>

    </section>

  </main>

  <footer class="foot">
    <p class="t-caption c-secondary">저장하면 날짜·루틴 목록에 오늘 날짜로 반영돼요</p>
    <button class="cta" type="button" data-token="component/button">저장하기</button>
  </footer>

</body>
</html>
